name: backend-tests

# CellTrail 後端測試 CI
# - 觸發：push 到 main / 任何對 main 的 PR
# - 範圍：backend/app/tests（全套 DB-free，不需 PostGIS / Redis / Google，
#   見 CLAUDE.md 第三節「smoke tests 不依賴 DB / Redis / Google」）
# - 目的：守住 ingest 正規化、auth/權限守衛、分享連結狀態機等回歸破壞。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 測試檔本身會 os.environ.setdefault 這些值；在此再設一次，避免
      # 任何 import-time 對環境變數的依賴因 collection 順序而踩雷。
      DATABASE_URL: postgresql://user:pass@localhost:5432/fakedb
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-only-for-pytest
      CORS_ORIGINS: http://localhost:5500
      AUTH_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest app/tests/ -v

      # AGENTS.md 是 CLAUDE.md 的機械產物（見 scripts/sync_agents_md.sh）。
      # 兩份曾在 2026-07-08～08-22 之間 drift 一個多月，導致 Codex 讀到的版本
      # 缺少「OSM 會回傳錯誤座標」這條最危險的警告 —— 那不是文件不整齊，
      # 而是讓另一個 agent 重蹈已知的坑。故在 CI 直接擋下不同步的 commit。
      - name: Check AGENTS.md is in sync with CLAUDE.md
        working-directory: .
        run: bash scripts/sync_agents_md.sh --check

  # ── 前端純函式測試（零依賴 Node，不需瀏覽器 / DB）──
  # 為什麼要進 CI：preview-state.js / api.js 承擔的是「訪客資料交接」與「response
  # allowlist（絕不保存 _records）」這類安全相關邏輯，先前只在本機手動跑，
  # 破壞了不會有人發現。真瀏覽器 smoke 需要 Chrome 與後端，仍留在本機。
  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preview client contract tests
        run: node test_preview_client.js
      - name: Preview flow / guest handoff tests
        run: node test_preview_temp_flow.js

  # ── 依賴漏洞掃描 ──
  # 2026-08-22 體檢時實測有 **76 個已知漏洞散在 16 個套件**，其中 python-multipart
  # （每一次檔案上傳都經過）、starlette（HTTP 核心）、pdfminer.six（解析使用者上傳的
  # PDF）都在**未登入訪客也能觸及**的路徑上。它們能累積到這個數量，正是因為
  # 沒有任何一道關卡在看 —— 一次性修補解決不了這件事，必須讓 CI 持續盯著。
  #
  # 刻意「只報告、不擋 build」（continue-on-error）：
  #   上游幾乎天天有新通報，硬擋會讓與本次改動無關的 PR 全部變紅，
  #   接著大家就會養成忽略紅燈的習慣 —— 那比沒有掃描更糟。
  #   目標是讓漏洞「一直看得見」，而不是製造一個必然被繞過的關卡。
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan pinned dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off
